LogLevel = 'info'
Agents = 'audiomuseai,listenbrainz,apple-music,deezer,lastfm'
ArtistArtPriority = 'folder.*, artist.*, album/artist.*, external, album/folder.*, album/cover.*'
Backup.Path = '/data/backups/'
Backup.Count = '3'
Backup.Schedule = '@every 24h'
CoverArtPriority = 'folder.*, front.*, cover.*, embedded, box.*, external, cdart.*'
CoverArtQuality = '100'
DefaultTheme = 'Spotify-ish'
EnableArtworkUpload = 'true'
EnableMediaFileCoverArt = 'false'
EnableReplayGain = 'true'
EnableSharing = 'true'
EnableTranscodingConfig = 'false'
ImageCacheSize = '30GB'
LastFM.ApiKey = ''
LastFM.Secret = ''
LastFM.Language = 'en'
LastFM.ScrobbleFirstArtistOnly = 'false'
Plugins.AutoReload = 'true'
PreferSortTags = 'true'
RecentlyAddedByModTime = 'true'
Scanner.Schedule = '@every 24h'
Scanner.ArtistJoiner = ', '
Search.FullString = 'true'
Subsonic.ArtistParticipations = 'true'
Subsonic.DefaultReportRealPath = 'true'
Tags.albumartist.Aliases = ['albumartist']
Tags.artist.Aliases = ['tpe1', 'artist', '©art', 'iart']
Tags.author.Aliases = ['author']
Tags.mood.Aliases = ['ab:mood']
Transcoding.EnableCancellation = 'true'
TranscodingCacheSize = '50GB'
UILoginBackgroundUrl = ''
LyricsPriority = '.ttml,.yaml,.yml,.elrc,.lrc,nd-lyrics,.srt,.txt,embedded'
